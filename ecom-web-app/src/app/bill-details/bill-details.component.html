<div class="container mt-3" *ngIf="bill">
  <h3>Bill {{bill.id}}</h3>
  <p>Date : {{bill.billingDate | date:'dd/MM/yyyy'}}</p>
  <p *ngIf="bill.customer">Customer : {{bill.customer.name}} ({{bill.customer.email}})</p>
  <table class="table">
    <thead><tr><th>Product</th><th>Quantity</th><th>Unit Price</th></tr></thead>
    <tbody>
      <tr *ngFor="let item of bill.productItems">
        <td>{{item.product.name}}</td><td>{{item.quantity}}</td><td>{{item.unitPrice}}</td>
      </tr>
    </tbody>
  </table>
</div>
